<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 274" width="880" height="274" role="img" aria-label="A named-reference opener achieved 77 percent acceptance and eight interested replies from 90 sends">
<style>
  :root{--ink:#E7E9EC;--mut:#79828D;--rule:#2C3239;--bg:#101216;
        --a:#DFFF00;--b:#39414A;--dead:#4A525B;--fill:#181C21}
  @media (prefers-color-scheme:light){:root:not([data-theme=dark]){
        --ink:#14161A;--mut:#68707A;--rule:#D8D8CF;--bg:#FFFFFF;
        --a:#6B7A00;--b:#C3C8CE;--dead:#AEB4BB;--fill:#F1F1ED}}
  :root[data-theme=light]{--ink:#14161A;--mut:#68707A;--rule:#D8D8CF;--bg:#FFFFFF;
        --a:#6B7A00;--b:#C3C8CE;--dead:#AEB4BB;--fill:#F1F1ED}
  .bg{fill:var(--bg)}
  .ttl{fill:var(--ink);font:600 17px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .sub{fill:var(--mut);font:400 12.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .lbl{fill:var(--ink);font:400 12.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .sm{fill:var(--mut);font:400 11px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .hdr{fill:var(--mut);font:500 10.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.5px}
  .num{fill:var(--a);font:600 16px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .zero{fill:var(--dead);font:600 16px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .bar{fill:var(--b)} .barw{fill:var(--a);opacity:.85}
  .rule{stroke:var(--rule);stroke-width:1}
  .note{fill:var(--mut);font:400 11.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="880" height="274"/>
<text class="ttl" x="28" y="32">The smallest campaign was the best one.</text>
<text class="sub" x="28" y="54">A named-reference opener against the standard sequence rolled out across three senders.</text>
<text class="hdr" x="560" y="78">ACCEPTED</text>
<text class="hdr" x="690" y="78">SENT</text>
<text class="hdr" x="840" y="78" text-anchor="end">INTERESTED</text>
<line class="rule" x1="28" y1="84" x2="852" y2="84"/>
<text class="lbl" x="28" y="120">Named-reference opener</text>
<rect class="barw" x="330" y="106" width="200" height="14" rx="3"/>
<text class="sm" x="560" y="120">77%</text>
<text class="sm" x="690" y="120">90</text>
<text class="num" x="840" y="120" text-anchor="end">8</text>
<text class="lbl" x="28" y="162">Second batch, one sender</text>
<rect class="barw" x="330" y="148" width="135" height="14" rx="3"/>
<text class="sm" x="560" y="162">52%</text>
<text class="sm" x="690" y="162">110</text>
<text class="num" x="840" y="162" text-anchor="end">6</text>
<text class="lbl" x="28" y="204">Standard sequence, three senders</text>
<rect class="bar" x="330" y="190" width="65" height="14" rx="3"/>
<text class="sm" x="560" y="204">25%</text>
<text class="sm" x="690" y="204">1,111</text>
<text class="lbl" x="840" y="204" text-anchor="end">16</text>
<line class="rule" x1="28" y1="234" x2="852" y2="234"/>
<text class="note" x="28" y="256">1,111 sends produced 16. The 200 before them produced 14.</text>
</svg>