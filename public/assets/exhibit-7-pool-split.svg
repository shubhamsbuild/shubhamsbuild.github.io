<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 232" width="880" height="232" role="img" aria-label="After 23 July pool A returned 226 replies and 13 interested from 14,219 sends; pool B returned 15 replies and none from 7,433">
<style>
  :root{--ink:#E7E9EC;--mut:#79828D;--rule:#2C3239;--bg:#101216;
        --a:#DFFF00;--b:#39414A;--dead:#4A525B;--fill:#181C21}
  @media (prefers-color-scheme:light){:root:not([data-theme=dark]){
        --ink:#14161A;--mut:#68707A;--rule:#D8D8CF;--bg:#FFFFFF;
        --a:#6B7A00;--b:#C3C8CE;--dead:#AEB4BB;--fill:#F1F1ED}}
  :root[data-theme=light]{--ink:#14161A;--mut:#68707A;--rule:#D8D8CF;--bg:#FFFFFF;
        --a:#6B7A00;--b:#C3C8CE;--dead:#AEB4BB;--fill:#F1F1ED}
  .bg{fill:var(--bg)} .box{fill:var(--fill);stroke:var(--rule)}
  .ttl{fill:var(--ink);font:600 17px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .sub{fill:var(--mut);font:400 12.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .lbl{fill:var(--ink);font:400 12.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .sm{fill:var(--mut);font:400 11px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .hdr{fill:var(--mut);font:500 10.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.5px}
  .num{fill:var(--a);font:600 16px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .big{fill:var(--a);font:600 24px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.6px}
  .zero{fill:var(--dead);font:600 16px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .bar{fill:var(--b)} .barw{fill:var(--a);opacity:.85}
  .rule{stroke:var(--rule);stroke-width:1}
  .wire{stroke:var(--rule);stroke-width:1.2;fill:none}
  .note{fill:var(--mut);font:400 11.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="880" height="232"/>
<text class="ttl" x="28" y="32">One inbox pool had quietly stopped being delivered.</text>
<text class="sub" x="28" y="54">After 23 July. Same campaigns, same lists, same days.</text>
<text class="hdr" x="150" y="80">REPLIES</text>
<text class="hdr" x="650" y="80">SENDS</text>
<text class="hdr" x="840" y="80" text-anchor="end">INTERESTED</text>
<line class="rule" x1="28" y1="86" x2="852" y2="86"/>
<text class="lbl" x="28" y="126">Pool A</text>
<rect class="barw" x="150" y="112" width="460" height="14" rx="3"/>
<text class="sm" x="620" y="126">226</text>
<text class="sm" x="650" y="126">14,219</text>
<text class="num" x="840" y="127" text-anchor="end">13</text>
<text class="lbl" x="28" y="172">Pool B</text>
<rect class="bar" x="150" y="158" width="31" height="14" rx="3"/>
<text class="sm" x="191" y="172">15</text>
<text class="sm" x="650" y="172">7,433</text>
<text class="zero" x="840" y="173" text-anchor="end">0</text>
<line class="rule" x1="28" y1="192" x2="852" y2="192"/>
<text class="note" x="28" y="214">Pool B returned 220 replies in July. Through August it sent 7,433 and returned fifteen.</text>
</svg>