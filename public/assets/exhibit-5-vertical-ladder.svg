<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 428" width="880" height="428" role="img" aria-label="Seven verticals run in order; lawyers in Texas produced 28 of 44 interested replies, three verticals produced none">
<style>
  :root{--ink:#E7E9EC;--mut:#79828D;--rule:#2C3239;--bg:#101216;
        --a:#DFFF00;--b:#39414A;--dead:#4A525B;--fill:#181C21}
  @media (prefers-color-scheme:light){:root:not([data-theme=dark]){
        --ink:#14161A;--mut:#68707A;--rule:#D8D8CF;--bg:#FFFFFF;
        --a:#6B7A00;--b:#C3C8CE;--dead:#AEB4BB;--fill:#F1F1ED}}
  :root[data-theme=light]{--ink:#14161A;--mut:#68707A;--rule:#D8D8CF;--bg:#FFFFFF;
        --a:#6B7A00;--b:#C3C8CE;--dead:#AEB4BB;--fill:#F1F1ED}
  .bg{fill:var(--bg)} .box{fill:var(--fill);stroke:var(--rule)}
  .ttl{fill:var(--ink);font:600 17px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .sub{fill:var(--mut);font:400 12.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .lbl{fill:var(--ink);font:400 12.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .sm{fill:var(--mut);font:400 11px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .hdr{fill:var(--mut);font:500 10.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.5px}
  .num{fill:var(--a);font:600 16px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .big{fill:var(--a);font:600 24px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.6px}
  .zero{fill:var(--dead);font:600 16px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .bar{fill:var(--b)} .barw{fill:var(--a);opacity:.85}
  .rule{stroke:var(--rule);stroke-width:1}
  .wire{stroke:var(--rule);stroke-width:1.2;fill:none}
  .note{fill:var(--mut);font:400 11.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="880" height="428"/>
<text class="ttl" x="28" y="32">Seven verticals, run in order. Three produced nothing.</text>
<text class="sub" x="28" y="54">Bar is volume sent. The number on the right is interested replies.</text>
<text class="hdr" x="250" y="78">VOLUME</text>
<text class="hdr" x="650" y="78">SENDS</text>
<text class="hdr" x="840" y="78" text-anchor="end">INTERESTED</text>
<line class="rule" x1="28" y1="84" x2="852" y2="84"/>
<text class="lbl" x="28" y="120">22 Jul   HVAC, three angles</text>
<rect class="barw" x="250" y="107" width="104" height="12" rx="3"/>
<text class="sm" x="650" y="120">6,397</text>
<text class="num" x="840" y="121" text-anchor="end">3</text>
<text class="lbl" x="28" y="160">23 Jul   Lawyers, Texas</text>
<rect class="barw" x="250" y="147" width="380" height="12" rx="3"/>
<text class="sm" x="650" y="160">23,284</text>
<text class="num" x="840" y="161" text-anchor="end">28</text>
<text class="lbl" x="28" y="200">7 Aug    Water restoration</text>
<rect class="bar" x="250" y="187" width="16" height="12" rx="3"/>
<text class="sm" x="650" y="200">1,010</text>
<text class="zero" x="840" y="201" text-anchor="end">0</text>
<text class="lbl" x="28" y="240">13 Aug   Roofing</text>
<rect class="barw" x="250" y="227" width="140" height="12" rx="3"/>
<text class="sm" x="650" y="240">8,556</text>
<text class="num" x="840" y="241" text-anchor="end">8</text>
<text class="lbl" x="28" y="280">20 Aug   Lawyers, Florida</text>
<rect class="barw" x="250" y="267" width="124" height="12" rx="3"/>
<text class="sm" x="650" y="280">7,588</text>
<text class="num" x="840" y="281" text-anchor="end">5</text>
<text class="lbl" x="28" y="320">22 Aug   Roofing, 2nd batch</text>
<rect class="bar" x="250" y="307" width="33" height="12" rx="3"/>
<text class="sm" x="650" y="320">2,038</text>
<text class="zero" x="840" y="321" text-anchor="end">0</text>
<text class="lbl" x="28" y="360">27 Aug   Plumbing</text>
<rect class="bar" x="250" y="347" width="40" height="12" rx="3"/>
<text class="sm" x="650" y="360">2,460</text>
<text class="zero" x="840" y="361" text-anchor="end">0</text>
<line class="rule" x1="28" y1="388" x2="852" y2="388"/>
<text class="note" x="28" y="410">Three angles died together on the first wave, so the copy was not the problem.</text>
</svg>