<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 268" width="880" height="268" role="img" aria-label="Creator-platform lists converted at 2.37 percent per contact against 0.63 percent for follower scrapes">
<style>
  :root{--ink:#E7E9EC;--mut:#79828D;--rule:#2C3239;--bg:#101216;
        --a:#DFFF00;--b:#39414A;--dead:#4A525B;--fill:#181C21}
  @media (prefers-color-scheme:light){:root:not([data-theme=dark]){
        --ink:#14161A;--mut:#68707A;--rule:#D8D8CF;--bg:#FFFFFF;
        --a:#6B7A00;--b:#C3C8CE;--dead:#AEB4BB;--fill:#F1F1ED}}
  :root[data-theme=light]{--ink:#14161A;--mut:#68707A;--rule:#D8D8CF;--bg:#FFFFFF;
        --a:#6B7A00;--b:#C3C8CE;--dead:#AEB4BB;--fill:#F1F1ED}
  .bg{fill:var(--bg)} .box{fill:var(--fill);stroke:var(--rule)}
  .ttl{fill:var(--ink);font:600 17px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .sub{fill:var(--mut);font:400 12.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .lbl{fill:var(--ink);font:400 12.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .sm{fill:var(--mut);font:400 11px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .hdr{fill:var(--mut);font:500 10.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.5px}
  .num{fill:var(--a);font:600 16px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .big{fill:var(--a);font:600 24px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.6px}
  .zero{fill:var(--dead);font:600 16px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .bar{fill:var(--b)} .barw{fill:var(--a);opacity:.85}
  .rule{stroke:var(--rule);stroke-width:1}
  .wire{stroke:var(--rule);stroke-width:1.2;fill:none}
  .note{fill:var(--mut);font:400 11.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="880" height="268"/>
<text class="ttl" x="28" y="32">Four ways to build the same list, ranked.</text>
<text class="sub" x="28" y="54">Positive replies per person contacted, not per email sent, because most campaigns count auto-replies.</text>
<text class="hdr" x="430" y="80">RATE</text>
<text class="hdr" x="700" y="80">CONTACTED</text>
<text class="hdr" x="840" y="80" text-anchor="end">POSITIVE</text>
<line class="rule" x1="28" y1="86" x2="852" y2="86"/>
<text class="lbl" x="28" y="126">Where they publish (YouTube, Instagram, TikTok)</text>
<rect class="barw" x="430" y="112" width="200" height="14" rx="3"/>
<text class="sm" x="640" y="126">2.37%</text>
<text class="sm" x="700" y="126">43,693</text>
<text class="num" x="840" y="127" text-anchor="end">1,034</text>
<text class="lbl" x="28" y="168">What a database calls them (job title)</text>
<rect class="bar" x="430" y="154" width="74" height="14" rx="3"/>
<text class="sm" x="514" y="168">0.88%</text>
<text class="sm" x="700" y="168">26,216</text>
<text class="zero" x="840" y="169" text-anchor="end">231</text>
<text class="lbl" x="28" y="210">The tools that market runs on</text>
<rect class="bar" x="430" y="196" width="59" height="14" rx="3"/>
<text class="sm" x="499" y="210">0.70%</text>
<text class="sm" x="700" y="210">71,593</text>
<text class="zero" x="840" y="211" text-anchor="end">502</text>
<text class="lbl" x="28" y="252">Who follows them</text>
<rect class="bar" x="430" y="238" width="53" height="14" rx="3"/>
<text class="sm" x="493" y="252">0.63%</text>
<text class="sm" x="700" y="252">36,873</text>
<text class="zero" x="840" y="253" text-anchor="end">231</text>
<line class="rule" x1="28" y1="228" x2="852" y2="228"/>
<text class="note" x="28" y="250">3.8x between best and worst, across 95 campaigns and 777,724 sends.</text>
</svg>