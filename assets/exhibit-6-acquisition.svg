<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Four scattered public sources feed a scraper that finds directories first, producing 60,000 trade companies and 27,000 professionals">
<style>
  :root{--ink:#E7E9EC;--mut:#79828D;--rule:#2C3239;--bg:#101216;
        --a:#DFFF00;--b:#39414A;--dead:#4A525B;--fill:#181C21}
  @media (prefers-color-scheme:light){:root:not([data-theme=dark]){
        --ink:#14161A;--mut:#68707A;--rule:#D8D8CF;--bg:#FFFFFF;
        --a:#6B7A00;--b:#C3C8CE;--dead:#AEB4BB;--fill:#F1F1ED}}
  :root[data-theme=light]{--ink:#14161A;--mut:#68707A;--rule:#D8D8CF;--bg:#FFFFFF;
        --a:#6B7A00;--b:#C3C8CE;--dead:#AEB4BB;--fill:#F1F1ED}
  .bg{fill:var(--bg)} .box{fill:var(--fill);stroke:var(--rule)}
  .ttl{fill:var(--ink);font:600 17px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .sub{fill:var(--mut);font:400 12.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .lbl{fill:var(--ink);font:400 12.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .sm{fill:var(--mut);font:400 11px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .hdr{fill:var(--mut);font:500 10.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:.5px}
  .num{fill:var(--a);font:600 16px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .big{fill:var(--a);font:600 24px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.6px}
  .zero{fill:var(--dead);font:600 16px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:-.3px}
  .bar{fill:var(--b)} .barw{fill:var(--a);opacity:.85}
  .rule{stroke:var(--rule);stroke-width:1}
  .wire{stroke:var(--rule);stroke-width:1.2;fill:none}
  .note{fill:var(--mut);font:400 11.5px Geist,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
</style>
<rect class="bg" width="880" height="300"/>
<text class="ttl" x="28" y="32">None of these companies are in a database.</text>
<text class="sub" x="28" y="54">Four scattered public sources, no shared identifier, assembled into one list.</text>
<rect class="box" x="28" y="86" width="190" height="30" rx="7"/>
<text class="sm" x="40" y="106">Map listings</text>
<path class="wire" d="M218 101 H300"/>
<rect class="box" x="28" y="126" width="190" height="30" rx="7"/>
<text class="sm" x="40" y="146">Business directories</text>
<path class="wire" d="M218 141 H300"/>
<rect class="box" x="28" y="166" width="190" height="30" rx="7"/>
<text class="sm" x="40" y="186">Manufacturer locators</text>
<path class="wire" d="M218 181 H300"/>
<rect class="box" x="28" y="206" width="190" height="30" rx="7"/>
<text class="sm" x="40" y="226">Licence registers</text>
<path class="wire" d="M218 221 H300"/>
<path class="wire" d="M300 101 V226"/>
<rect class="box" x="300" y="112" width="250" height="84" rx="9"/>
<text class="lbl" x="316" y="136">Scraper</text>
<text class="sm" x="316" y="156">finds the directories first,</text>
<text class="sm" x="316" y="174">then works each one</text>
<path class="wire" d="M550 154 H610"/>
<text class="big" x="630" y="132">~60,000</text>
<text class="sm" x="630" y="150">trade companies</text>
<text class="big" x="630" y="186">~27,000</text>
<text class="sm" x="630" y="204">professionals</text>
<line class="rule" x1="28" y1="260" x2="852" y2="260"/>
<text class="note" x="28" y="282">Spent with list vendors: nothing. Point it at a new trade and it goes looking.</text>
</svg>